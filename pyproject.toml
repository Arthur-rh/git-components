[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-component"
version = "0.1.1"
description = "Import selected content from external Git repositories into the current repository, using a declarative manifest and a lock."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Arthur Richelet" }]
dependencies = ["PyYAML>=6.0"]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Repository = "https://gitlab.arthur-richelet.fr/git-tools/git-components"

[project.scripts]
git-component = "gitcomponent.cli:run_cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
