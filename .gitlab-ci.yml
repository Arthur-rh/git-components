# Release pipeline for git-component (see README.md "Releasing").
#
# Only runs on a tag push matching vX.Y.Z, on any branch — in practice
# that's expected to be a fast-forwarded commit on `release`. Publishes
# to PyPI, creates a GitLab Release, and pushes the same commit + tag to
# the public GitHub mirror, all from one pipeline run.

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

stages:
  - test
  - build
  - publish

test:
  stage: test
  image: python:3.11
  script:
    - pip install -r requirements-dev.txt
    - PYTHONPATH=src pytest
    - |
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      PYPROJECT_VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
      if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
        echo "Tag $CI_COMMIT_TAG does not match pyproject.toml version $PYPROJECT_VERSION"
        exit 1
      fi
      echo "Tag $CI_COMMIT_TAG matches pyproject.toml version $PYPROJECT_VERSION"

build:
  stage: build
  image: python:3.11
  needs: ["test"]
  script:
    - pip install build
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

publish-pypi:
  stage: publish
  image: python:3.11
  needs: ["build"]
  script:
    - pip install twine
    - TWINE_USERNAME=__token__ TWINE_PASSWORD="$PYPI_PUBLISH_TOKEN" twine upload dist/*

gitlab-release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["test"]
  script:
    - echo "Creating GitLab release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Release $CI_COMMIT_TAG"

# Pushes this tag's commit to the public GitHub mirror (default branch
# `main` there, matching GitHub convention, even though this branch is
# `release` on GitLab). GITHUB_DEPLOY_TOKEN is stored without its
# -----BEGIN/END----- markers and with internal line breaks stripped,
# because GitLab masked variables must be a single line with no
# whitespace — reconstructed below into a normal OpenSSH private key.
mirror-github:
  stage: publish
  # alpine/git sets ENTRYPOINT ["git"], which breaks GitLab Runner's normal
  # script execution (every command gets prefixed with `git`) unless reset.
  image:
    name: alpine/git:latest
    entrypoint: [""]
  needs: ["test"]
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache openssh-client
  script:
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - eval "$(ssh-agent -s)"
    # GITHUB_DEPLOY_TOKEN's original key type (OpenSSH vs. legacy PEM
    # RSA/EC) isn't recorded anywhere, so try each known header/footer
    # pair until ssh-add accepts one, instead of hardcoding a guess.
    - |
      added=0
      for hdr in "OPENSSH PRIVATE KEY" "RSA PRIVATE KEY" "EC PRIVATE KEY" "PRIVATE KEY"; do
        {
          echo "-----BEGIN $hdr-----"
          echo "$GITHUB_DEPLOY_TOKEN" | fold -w 64
          echo "-----END $hdr-----"
        } > ~/.ssh/github_deploy_key
        chmod 600 ~/.ssh/github_deploy_key
        if ssh-add ~/.ssh/github_deploy_key 2>/dev/null; then
          added=1
          echo "Loaded GITHUB_DEPLOY_TOKEN as a '$hdr' key"
          break
        fi
      done
      if [ "$added" != "1" ]; then
        echo "Could not load GITHUB_DEPLOY_TOKEN under any known private key format" >&2
        exit 1
      fi
    - ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
    - git remote add github-mirror "$GITHUB_MIRROR_URL"
    - git push github-mirror "HEAD:refs/heads/main" --force
    # Push every tag, not just this one, so a release whose mirror push
    # previously failed gets backfilled by the next successful run.
    - git push github-mirror --tags --force
