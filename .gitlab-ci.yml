# Release pipeline for git-component (see README.md "Releasing").
#
# Only runs on a tag push matching vX.Y.Z, on any branch — in practice
# that's expected to be a fast-forwarded commit on `release`. Publishes
# to PyPI, creates a GitLab Release, and pushes the same commit + tag to
# the public GitHub mirror, all from one pipeline run.

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

stages:
  - test
  - build
  - publish

test:
  stage: test
  image: python:3.11
  script:
    - pip install -r requirements-dev.txt
    - PYTHONPATH=src pytest
    - |
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      PYPROJECT_VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
      if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
        echo "Tag $CI_COMMIT_TAG does not match pyproject.toml version $PYPROJECT_VERSION"
        exit 1
      fi
      echo "Tag $CI_COMMIT_TAG matches pyproject.toml version $PYPROJECT_VERSION"

build:
  stage: build
  image: python:3.11
  needs: ["test"]
  script:
    - pip install build
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

publish-pypi:
  stage: publish
  image: python:3.11
  needs: ["build"]
  # TEMPORARILY DISABLED while mirror-github is debugged: every retry
  # here permanently burns a PyPI version (filenames can never be
  # reused, even after project deletion). Remove this once mirror-github
  # is confirmed working, so PyPI publishing resumes for real releases.
  rules:
    - when: never
  script:
    - pip install twine
    - TWINE_USERNAME=__token__ TWINE_PASSWORD="$PYPI_PUBLISH_TOKEN" twine upload dist/*

gitlab-release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["test"]
  script:
    - echo "Creating GitLab release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Release $CI_COMMIT_TAG"

# Pushes this tag's commit to the public GitHub mirror (default branch
# `main` there, matching GitHub convention, even though this branch is
# `release` on GitLab). GITHUB_DEPLOY_TOKEN is a GitLab "File"-type
# variable, not a masked env var: its value is a path to a file GitLab
# already populated with the complete, correctly-formatted private key
# (file-type variables aren't subject to the single-line/no-whitespace
# restriction masked env vars have), so it's used directly, no
# reconstruction needed.
mirror-github:
  stage: publish
  # alpine/git sets ENTRYPOINT ["git"], which breaks GitLab Runner's normal
  # script execution (every command gets prefixed with `git`) unless reset.
  image:
    name: alpine/git:latest
    entrypoint: [""]
  needs: ["test"]
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache openssh-client
  script:
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - eval "$(ssh-agent -s)"
    # `ssh-keygen -l -f` on the raw file said "not a public key file" --
    # not just an unsupported algorithm, it isn't recognizable as a key
    # at all. Likely the value is base64-encoded (whole key, headers
    # included, as one blob -- a standard trick for single-line-safe
    # secrets). Try decoding first; fall back to the raw file as-is.
    - |
      if base64 -d "$GITHUB_DEPLOY_TOKEN" > ~/.ssh/github_deploy_key 2>/dev/null && grep -q "BEGIN.*PRIVATE KEY" ~/.ssh/github_deploy_key; then
        echo "GITHUB_DEPLOY_TOKEN decodes from base64 to a private key; using the decoded form"
      else
        echo "GITHUB_DEPLOY_TOKEN does not decode to a recognizable key; using it as-is"
        cp "$GITHUB_DEPLOY_TOKEN" ~/.ssh/github_deploy_key
      fi
      chmod 600 ~/.ssh/github_deploy_key
    - ssh-keygen -l -f ~/.ssh/github_deploy_key || echo "ssh-keygen could not read key metadata either"
    - ssh-add ~/.ssh/github_deploy_key
    - ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
    - git remote add github-mirror "$GITHUB_MIRROR_URL"
    - git push github-mirror "HEAD:refs/heads/main" --force
    # Push every tag, not just this one, so a release whose mirror push
    # previously failed gets backfilled by the next successful run.
    - git push github-mirror --tags --force
